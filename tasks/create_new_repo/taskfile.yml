# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:

  setup_devops_link:
    dir: '{{.RUN_DIR}}'
    prompt: If not done yet, create a new repo with name {{.REPO_NAME}} within {{.DEVOPS_ROOT}}, without readme and gitignore. Done?
    cmds:
      - git remote add origin {{.DEVOPS_ROOT_SSH}}/{{.REPO_NAME}}
      - git push -u origin --all
  
  setup_default_branch:
    prompt: Go to {{.DEVOPS_ROOT}}/_git/{{.REPO_NAME}}/branches, you can change the default branch here. Done?

  setup_build_pipeline:
    prompt: Go to {{.DEVOPS_ROOT}}/_git/{{.REPO_NAME}}, click "Set up build", then "save" (under "run"). Done?

  setup_build_policies:
    prompt: |-
      Go to {{.DEVOPS_ROOT}}/_git/{{.REPO_NAME}}/branches to set up build policies.
      Set up the following policies for develop and main branches.
      - Require a minimum of 2 reviewers (allow requestor to approve own changes)
      - Check for comment resolution
      - Build validation (select pipeline created in previous step, probably called '{{.REPO_NAME}}')
      Done?
